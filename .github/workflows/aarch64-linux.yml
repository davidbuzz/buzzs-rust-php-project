# Build and test on AArch64 Linux, on GitHub's native ARM64 runner (free for public
# repositories). The development box is x86-64, so this is where AArch64-only problems
# show up: the request heap's chunk map once rejected every chunk above 2^47, where
# AArch64 Linux maps user memory, and every small allocation became an mmap (PR #2).
name: AArch64 Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config strace apache2-dev \
            libssl-dev libxml2-dev libxslt1-dev libicu-dev libgd-dev libzip-dev \
            libsqlite3-dev libsodium-dev libmagic-dev libcurl4-openssl-dev libonig-dev \
            libbz2-dev zlib1g-dev libpcre2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p php-cli -p phpt-runner

      - name: Smoke test
        run: target/release/php -r 'echo 1 + 2, "\n";'

      # An empty script makes about 200 mmap calls (209 on x86-64, most of them the
      # dynamic loader mapping the shared libraries); with the chunk map rejecting
      # every chunk it made over 30,000.
      - name: The request heap keeps its chunks
        run: |
          n=$(strace -f -e trace=mmap -o /dev/stdout target/release/php -r '' | grep -c 'mmap(')
          echo "mmap calls for php -r '': $n"
          test "$n" -lt 2000

      # Before the engine tests: some of them (`frame_reuse`) read php-src's .phpt files.
      - name: Fetch the php-src tests (pinned)
        run: scripts/fetch-phpt-tests.sh

      - name: Unit tests (heap, values, streams)
        run: cargo test --release --no-fail-fast -p php-memlimit -p php-runtime -p php-streams

      # Informational until AArch64 has a baseline of its own.
      - name: Engine unit tests (informational)
        continue-on-error: true
        run: cargo test --release -p php-vm --no-fail-fast

      - name: PHPT, Zend and core tests (informational)
        continue-on-error: true
        run: |
          env -u LANGUAGE target/release/phpt-runner --php target/release/php -j 4 -q \
            --no-artifacts --baseline phpt-baseline.txt --summary-depth 1 \
            modules/php-src/Zend/tests modules/php-src/tests

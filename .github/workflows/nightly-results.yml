# php-src's .github/workflows/nightly-results.yml for this repository: when the nightly
# run of the Test workflow does not succeed, say so. Varied: upstream posts to a Slack
# channel; this opens an issue, or comments on the one already open. Upstream reacts to
# `failure` only; this also to `cancelled` (a job that ran into its time limit) and the
# rest, and only to runs on master (upstream runs this in php/php-src alone).
name: Nightly results
on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - master
permissions:
  issues: write
jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'success' }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Nightly CI failed"
          body="The nightly run ended ${{ github.event.workflow_run.conclusion }}: $RUN_URL"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

# php-src's .github/workflows/nightly-results.yml for this repository: when the nightly
# run of the Test workflow fails, say so. Varied: upstream posts to a Slack channel; this
# opens an issue, or comments on the one already open.
name: Nightly results
on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
permissions:
  issues: write
jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Nightly CI failed"
          body="Job(s) in the nightly run failed: $RUN_URL"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

# The nightly run: the long test variants that would make every push wait, and a check,
# on a commit nobody touched, that the world under it has not moved (the latest stable
# rustc, the runner image's libraries). Modelled on php-src's nightly (`test.yml`'s
# `schedule: cron: "0 1 * * *"`, `test-suite.yml`'s LINUX_X64 matrix and its test steps,
# `actions/test-linux`): the same time, job names, steps, INI settings, environment, MySQL
# 8.4 service and de_DE locale. Varied, as CI_PLAN.md says: Cargo instead of make,
# phpt-runner instead of run-tests.php, our trace JIT instead of php-src's tracing and
# function JITs, no ZTS axis, and every PHPT step informational until the runner has a
# baseline of its own. Each step's JSON report is kept as an artifact for that baseline.
name: Nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/test-linux's environment (the databases out of scope are left out).
  MYSQL_TEST_HOST: 127.0.0.1
  MYSQL_TEST_USER: root
  MYSQL_TEST_PASSWD: root
  MYSQL_TEST_DB: test
  PDO_MYSQL_TEST_DSN: "mysql:host=127.0.0.1;dbname=test"
  PDO_MYSQL_TEST_USER: root
  PDO_MYSQL_TEST_PASS: root
  SKIP_IO_CAPTURE_TESTS: 1
  STACK_LIMIT_DEFAULTS_CHECK: 1
  RUN_RESOURCE_HEAVY_TESTS: 1

jobs:
  LINUX:
    strategy:
      fail-fast: false
      matrix:
        include:
          # All four of upstream's test steps on the release build.
          - name: LINUX_X64_RELEASE
            runs-on: ubuntu-24.04
            profile: release
            steps: all
            repeat: 1
          # Upstream's `_REPEAT`: every test twice in one process (what a request
          # leaves behind for the next one).
          - name: LINUX_X64_REPEAT_RELEASE
            runs-on: ubuntu-24.04
            profile: release
            steps: default
            repeat: 2
          # Upstream's `DEBUG`: the dev profile (debug assertions, overflow checks), with
          # all four steps as upstream's has (a debug build takes about twice as long).
          - name: LINUX_X64_DEBUG
            runs-on: ubuntu-24.04
            profile: dev
            steps: all
            repeat: 1
          # Ours alone (upstream has no AArch64 Linux job): the trace JIT's AArch64
          # backend and the fibers there.
          - name: LINUX_ARM64_RELEASE
            runs-on: ubuntu-24.04-arm
            profile: release
            steps: all
            repeat: 1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config strace apache2-dev language-pack-de \
            libssl-dev libxml2-dev libxslt1-dev libicu-dev libgd-dev libzip-dev \
            libsqlite3-dev libsodium-dev libmagic-dev libcurl4-openssl-dev libonig-dev \
            libbz2-dev zlib1g-dev libpcre2-dev
          # actions/setup-x64: ext/ctype and others test under de_DE.
          sudo locale-gen de_DE

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}

      - name: System info
        run: |
          lscpu | head -20
          rustc --version

      - name: Build (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = release ]; then
            cargo build --release -p php-cli -p phpt-runner
            echo "BIN=target/release" >> "$GITHUB_ENV"
          else
            cargo build -p php-cli -p phpt-runner
            echo "BIN=target/debug" >> "$GITHUB_ENV"
          fi

      - name: Fetch the php-src tests (pinned)
        run: scripts/fetch-phpt-tests.sh

      # One test step as actions/test-linux runs it, with phpt-runner. $1 names the
      # step's report, the rest are extra runner arguments.
      - name: Write the test step
        run: |
          cat > "$RUNNER_TEMP/phpt-step.sh" <<'EOF'
          #!/bin/bash
          name=$1; shift
          env -u LANGUAGE "$BIN/phpt-runner" --php "$BIN/php" -q --no-artifacts \
            -j "$(nproc)" --timeout 120 --repeat "${{ matrix.repeat }}" \
            --baseline phpt-baseline.txt --summary-depth 1 \
            -d opcache.protect_memory=1 -d opcache.jit_buffer_size=64M \
            --json "reports/$name.json" "$@" modules/php-src > "reports/$name.txt" 2>&1
          rc=$?
          {
            echo "### $name (exit $rc)"
            echo '```'
            grep -aE '^Tests (skipped|failed|passed)|^Baseline:' "reports/$name.txt"
            grep -a '^NEW FAILURE' "reports/$name.txt" | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
          EOF
          chmod +x "$RUNNER_TEMP/phpt-step.sh"
          mkdir -p reports

      # Upstream's "Test": opcache off and no JIT.
      - name: Test
        if: matrix.steps == 'all'
        continue-on-error: true
        run: $RUNNER_TEMP/phpt-step.sh test --env BUZZS_JIT=0

      # Upstream's "Test Tracing JIT": opcache on, the tracing JIT (ours).
      - name: Test Tracing JIT
        if: matrix.steps == 'all'
        continue-on-error: true
        run: $RUNNER_TEMP/phpt-step.sh tracing-jit -d opcache.enable_cli=1 -d opcache.jit=tracing

      # Upstream's "Test OpCache": opcache on, no JIT.
      - name: Test OpCache
        if: matrix.steps == 'all'
        continue-on-error: true
        run: $RUNNER_TEMP/phpt-step.sh opcache -d opcache.enable_cli=1 -d opcache.jit=disable --env BUZZS_JIT=0

      # Upstream's "Test Function JIT" slot: we have no function JIT, so the
      # configuration users get: opcache off, our trace JIT on.
      - name: Test (default JIT)
        continue-on-error: true
        run: $RUNNER_TEMP/phpt-step.sh default-jit

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpt-${{ matrix.name }}
          path: reports/
          retention-days: 14

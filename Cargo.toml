[workspace]
resolver = "2"
members = [
    "crates/php-lexer",
    "crates/php-parser",
    "crates/php-runtime",
    "crates/php-vm",
    "crates/php-cli",
    "crates/phpt-runner",
    "crates/php-support",
    "crates/php-hash",
    "crates/php-random",
    "crates/php-date",
    "crates/php-pcre",
    "crates/php-stdstr",
    "crates/php-streams",
    "crates/php-stdarr",
    "crates/php-mbstring",
    "crates/php-json",
    "crates/php-filter",
    "crates/php-ctype",
    "crates/php-uri",
    "crates/php-bcmath",
    "crates/php-gmp",
    "crates/php-calendar",
    "crates/php-zlib",
    "crates/php-bz2",
    "crates/php-iconv",
    "crates/php-posix",
    "crates/php-openssl",
    "crates/php-sqlite",
    "crates/php-libxml",
    "crates/php-intl",
    "crates/php-exif",
    "crates/php-sockets",
    "crates/php-sysv",
    "crates/php-gettext",
    "crates/php-pcntl",
    "crates/php-spl",
    "crates/php-session",
    "crates/php-stdmisc",
    "crates/php-phar",
    "crates/php-dom",
    "crates/php-simplexml",
    "crates/php-xmlreader",
    "crates/php-pdo",
    "crates/php-soap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

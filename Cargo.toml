[workspace]
resolver = "2"
members = [
    "crates/php-lexer",
    "crates/php-parser",
    "crates/php-runtime",
    "crates/php-vm",
    "crates/php-cli",
    "crates/phpt-runner",
    "crates/php-support",
    "crates/php-hash",
    "crates/php-random",
    "crates/php-date",
    "crates/php-pcre",
    "crates/php-stdstr",
    "crates/php-streams",
    "crates/php-stdarr",
    "crates/php-mbstring",
    "crates/php-json",
    "crates/php-filter",
    "crates/php-ctype",
    "crates/php-uri",
    "crates/php-bcmath",
    "crates/php-gmp",
    "crates/php-calendar",
    "crates/php-zlib",
    "crates/php-bz2",
    "crates/php-iconv",
    "crates/php-posix",
    "crates/php-openssl",
    "crates/php-sqlite",
    "crates/php-libxml",
    "crates/php-intl",
    "crates/php-exif",
    "crates/php-sockets",
    "crates/php-sysv",
    "crates/php-gettext",
    "crates/php-pcntl",
    "crates/php-spl",
    "crates/php-session",
    "crates/php-stdmisc",
    "crates/php-phar",
    "crates/php-dom",
    "crates/php-simplexml",
    "crates/php-xmlreader",
    "crates/php-pdo",
    "crates/php-soap",
    "crates/php-ext-filter",
    "crates/php-ext-stdmisc",
    "crates/php-mysqlnd",
    "crates/php-ext-mysqli",
    "crates/php-sapi-apache2",
    "crates/php-zip",
    "crates/php-fileinfo",
    "crates/php-sodium",
    "crates/php-xsl",
    "crates/php-ext-soap",
    "crates/php-ext-pcntl",
    "crates/php-ext-gettext",
    "crates/php-ext-sysv",
    "crates/php-ext-sockets",
    "crates/php-ext-phar",
    "crates/php-ext-uri",
    "crates/php-ext-exif",
    "crates/php-ext-calendar",
    "crates/php-ext-gmp",
    "crates/php-ext-bcmath",
    "crates/php-ext-xmlreader",
    "crates/php-ext-simplexml",
    "crates/php-ext-xml",
    "crates/php-ext-dom",
    "crates/php-ext-session",
    "crates/php-ext-posix",
    "crates/php-ext-iconv",
    "crates/php-ext-zlib",
    "crates/php-ext-openssl",
    "crates/php-ext-intl",
    "crates/php-ext-fileinfo",
    "crates/php-ext-sodium",
    "crates/php-ext-zip",
    "crates/php-ext-pdo",
    "crates/php-ext-stdarr",
    "crates/php-ext-mbstring",
    "crates/php-ext-random",
    "crates/php-ext-hash",
    "crates/php-ext-spl",
    "crates/php-ext-date",
    "crates/php-ext-pcre",
    "crates/php-ext-stdstr",
    "crates/php-ext-json",
    "crates/php-ext-streams",
    "crates/php-ext-ctype",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

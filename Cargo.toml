[workspace]
resolver = "2"
members = [
    "crates/php-lexer",
    "crates/php-parser",
    "crates/php-runtime",
    "crates/php-vm",
    "crates/php-cli",
    "crates/phpt-runner",
    "crates/php-support",
    "crates/php-hash",
    "crates/php-random",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

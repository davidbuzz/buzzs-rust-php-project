[package]
name = "php-ext-openssl"
description = "ext/openssl binding for the phprust VM over the php-openssl library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-vm = { path = "../php-vm" }
php-runtime = { path = "../php-runtime" }
php-openssl = { path = "../php-openssl" }
php-support = { path = "../php-support" }
# `Openssl\Session` wraps an `SSL_SESSION` (the library has no session API).
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"

[lints]
workspace = true

[package]
name = "php-ext-zendtest"
description = "ext/zend_test binding for the phprust VM (the engine's test extension)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-vm = { path = "../php-vm" }
php-runtime = { path = "../php-runtime" }
php-support = { path = "../php-support" }
php-parser = { path = "../php-parser" }
php-memlimit = { path = "../php-memlimit" }
libc = "0.2"

[features]
# The observer printer (`zend_test.observer.*`): needs the VM observer
# hooks proposed in `proposals/observer.diff`.
observer = []

[lints]
workspace = true

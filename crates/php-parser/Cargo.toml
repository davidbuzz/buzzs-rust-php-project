[package]
name = "php-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-lexer = { path = "../php-lexer" }
php-mbstring = { path = "../php-mbstring" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]

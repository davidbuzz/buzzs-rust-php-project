[package]
name = "php-phar"
description = "PHP's ext/phar: phar/tar/zip archive formats, manifest, signatures, stubs, the phar:// stream wrapper and the Phar/PharData/PharFileInfo method semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-runtime = { path = "../php-runtime" }
php-hash = { path = "../php-hash" }
php-streams = { path = "../php-streams" }
php-zlib = { path = "../php-zlib" }
# php-bz2 is still uncommitted work of another agent; bind libbz2 directly
# (bzip2-sys is already in the workspace lock file) until its API settles.
bzip2-sys = "0.1"
libc = "0.2"

[lints]
workspace = true

[package]
name = "php-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-lexer = { path = "../php-lexer" }
php-parser = { path = "../php-parser" }
php-mbstring = { path = "../php-mbstring" }
php-runtime = { path = "../php-runtime" }
php-support = { path = "../php-support" }
php-sapi = { path = "../php-sapi" }
php-random = { path = "../php-random" }
php-stdarr = { path = "../php-stdarr" }
php-stdstr = { path = "../php-stdstr" }
php-hash = { path = "../php-hash" }
php-memlimit = { path = "../php-memlimit" }
libc = "0.2"

[build-dependencies]
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64"] }

[dev-dependencies]
# The script tests under tests/ call standard array, string, JSON and preg
# functions, as real code does. (These crates depend on this one: cargo
# builds the library once and links the test binaries against both.)
php-ext-stdarr = { path = "../php-ext-stdarr" }
php-ext-stdstr = { path = "../php-ext-stdstr" }
php-ext-json = { path = "../php-ext-json" }
php-ext-pcre = { path = "../php-ext-pcre" }
php-ext-spl = { path = "../php-ext-spl" }

[lints]
workspace = true

[package]
name = "php-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-lexer = { path = "../php-lexer" }
php-parser = { path = "../php-parser" }
php-mbstring = { path = "../php-mbstring" }
php-runtime = { path = "../php-runtime" }
php-support = { path = "../php-support" }
php-random = { path = "../php-random" }
php-stdarr = { path = "../php-stdarr" }
php-stdstr = { path = "../php-stdstr" }
php-hash = { path = "../php-hash" }
php-memlimit = { path = "../php-memlimit" }
# The JIT's code generator (`src/exec/tape/jit.rs`). 0.121 is the newest
# line whose minimum Rust version is the workspace's (1.85).
cranelift-codegen = { version = "0.121", optional = true }
cranelift-frontend = { version = "0.121", optional = true }
cranelift-jit = { version = "0.121", optional = true }
cranelift-module = { version = "0.121", optional = true }
cranelift-native = { version = "0.121", optional = true }

[features]
default = ["jit"]
# Native code for hot op arrays (`opcache.jit`). Without it the setting is
# accepted and every op array stays on the interpreter.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[lints]
workspace = true

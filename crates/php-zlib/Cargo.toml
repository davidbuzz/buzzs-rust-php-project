[package]
name = "php-zlib"
description = "PHP's ext/zlib: gzcompress/gzencode/zlib_encode family, incremental deflate/inflate contexts, gzFile streams, zlib.* stream filters and ob_gzhandler, bound to the system zlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libz-sys = { version = "1.1", default-features = false, features = ["libc"] }
libc = "0.2"
php-streams = { path = "../php-streams" }

[lints]
workspace = true

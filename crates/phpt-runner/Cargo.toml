[package]
name = "phpt-runner"
description = "Runs php-src .phpt tests against a PHP binary (Rust port of run-tests.php)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "phpt_runner"
path = "src/lib.rs"

[[bin]]
name = "phpt-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "resource"] }
os_pipe = "1.2"
pcre2 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

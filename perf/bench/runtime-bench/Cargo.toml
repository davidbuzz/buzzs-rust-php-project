# Criterion micro-benchmarks of php-runtime's zend_hash / zend_string /
# zend_operators equivalents. A standalone workspace (not a member of the
# phprust workspace, so it never touches the root Cargo.toml or Cargo.lock).
#
#   cd perf/bench/runtime-bench
#   cargo bench -- --save-baseline main       # builds into the repo's target/release
#   ... change php-runtime ...
#   cargo bench -- --baseline main
[package]
name = "php-runtime-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
php-runtime = { path = "../../../crates/php-runtime" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "runtime"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
